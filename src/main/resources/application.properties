spring.application.name=Restaurant_Management_System


spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_management
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql on every startup; defer until after Hibernate builds the schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080

# Restaurant operating hours (24h clock, inclusive open, exclusive close)
restaurant.opening-hour=10
restaurant.closing-hour=22

jwt.secret=clarivate-capstone-restaurant-management-system-jwt-secret-key-2026